name: Update data & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"          # every 3 hours
    - cron: "*/30 16-23 * * 2,3,4"  # every 30 min on Tue/Wed/Thu evenings (UTC) during matches

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Champions League data
        run: node scripts/fetch-data.mjs
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}

      # Europa League and Conference League from UEFA's public match feeds. If UEFA is
      # unreachable the Champions League still updates; those pages keep their last data.
      - name: Fetch Europa League and Conference League data
        continue-on-error: true
        run: python3 scripts/fetch_uefa.py

      - name: Assemble site
        run: |
          mkdir _site
          cp index.html style.css app.js pots.json pots-el.json pots-ecl.json finals.json _site/
          cp -r data assets _site/
          # Cache-bust CSS/JS so browsers pick up new versions right away
          sed -i "s/style\.css\"/style.css?v=${GITHUB_SHA::7}\"/; s/app\.js\"/app.js?v=${GITHUB_SHA::7}\"/" _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
